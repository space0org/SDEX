<!DOCTYPE html>
<html>
<head>
    <title>SDEX - Decentralized Exchange</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="main.6cfdd60c6d0446e78031.css">
</head>
<body>
    <div id="connection-status"></div>
    <div id="main-content">
        <!-- Your existing content -->
    </div>

    <!-- Load Web3 and MetaMask integration -->
    <script src="dist/bundle.js"></script>
    <script>
        // Initialize Web3 when the page loads
        window.addEventListener('load', async () => {
            try {
                const success = await initWeb3();
                if (success) {
                    document.getElementById('connection-status').innerHTML = 
                        '<div class="alert alert-success">Connected to MetaMask on Sepolia network</div>';
                } else {
                    document.getElementById('connection-status').innerHTML = 
                        '<div class="alert alert-danger">Failed to connect to MetaMask</div>';
                }
            } catch (error) {
                console.error('Error initializing Web3:', error);
                document.getElementById('connection-status').innerHTML = 
                    '<div class="alert alert-danger">Error: ' + error.message + '</div>';
            }
        });
    </script>
</body>
</html>
